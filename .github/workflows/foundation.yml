name: Foundation contracts and web build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match the Gradle daemon's Java 21 requirement without a vendor build suffix.
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: bash gradlew :shared:jsNodeTest :business:jvmTest -PwebOnly=true --no-daemon --max-workers=1
      - run: npm ci --prefix web
      - run: node --test web/scripts/sync-business.test.mjs
      - run: node --test scripts/deploy-railway.test.mjs
      - run: node --test scripts/muse-gateway/server.test.mjs
      - run: npm run business:sync --prefix web
      - run: npm run build --prefix web
      - run: docker build -t resq-admin:check .
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-business-${{ github.sha }}
          path: web/src/generated/business/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: railway-staging
      url: https://www.admin.resq-app.co.ke/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-business-${{ github.sha }}
          path: web/src/generated/business/
      - run: npm install --global @railway/cli@5.62.1
      - name: Deploy and verify admin
        run: node scripts/deploy-railway.mjs admin
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
