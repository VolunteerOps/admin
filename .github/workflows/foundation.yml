name: Foundation contracts and web build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match the Gradle daemon's Java 21 requirement without a vendor build suffix.
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: bash gradlew :shared:jsNodeTest :business:jvmTest -PwebOnly=true --no-daemon --max-workers=1
      - run: npm ci --prefix web
      - run: npm run business:sync --prefix web
      - run: npm run build --prefix web
      - run: docker build -t resq-admin:check .
